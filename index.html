<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFFCO Visit</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IFFCO Visit"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#0f2238;--muted:#5b6b7c;--line:#dce2e9;--accent:#0f766e;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1620;--surface:#16222f;--ink:#eaf0f6;--muted:#9fb0c2;--line:#2a3a4b;--accent:#6c9bff;--danger:#ff8a80}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{max-width:360px;margin:0 auto;padding:12vh 20px 20px;text-align:center}
h1{font-size:26px;margin:0 0 4px}p{color:var(--muted);margin:6px 0 18px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--ink);text-align:center}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
#err{color:var(--danger);min-height:20px;margin-top:10px;font-size:14px;white-space:pre-wrap}#msg{color:var(--muted);font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
<div class="box"><h1>IFFCO Visit</h1><p id="sub">Loading...</p>
<form id="f" hidden autocomplete="off"><input id="pw" type="password" placeholder="Visit app password" autocomplete="current-password"><button id="go" type="submit">Open</button></form>
<div id="msg"></div><div id="err"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},TOUT=5000,LS="visit_";
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
function ft(url,ms){return new Promise(function(ok,no){var c=new AbortController(),t=setTimeout(function(){c.abort();no(new Error("timeout"))},ms);
 fetch(url,{cache:"no-store",signal:c.signal}).then(function(r){clearTimeout(t);if(!r.ok)no(new Error("http "+r.status));else ok(r)},function(e){clearTimeout(t);no(e)})})}
function lg(k){try{return localStorage.getItem(LS+k)}catch(e){return null}}function ls(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}}
async function getFiles(){var cache=null,ver=null;try{cache=await caches.open("visit-data")}catch(e){}
 try{ver=await (await ft("ver.json?t="+Date.now(),TOUT)).json()}catch(e){}
 var enc=cache&&await cache.match("data.enc"),app=cache&&await cache.match("app.enc"),fresh=false;
 if(ver){
  if(!enc||String(ver.d)!==lg("dver")){$("#msg").textContent="Getting the latest data...";
   try{var r1=await ft("data.enc?v="+ver.d,60000);if(cache)await cache.put("data.enc",r1.clone());enc=r1;ls("dver",String(ver.d));fresh=true}catch(e){if(!enc)throw new Error("Could not download. Check your internet and try again.")}}
  if(!app||String(ver.a)!==lg("aver")){$("#msg").textContent="Getting the app (first time can take a minute)...";
   try{var r2=await ft("app.enc?v="+ver.a,300000);if(cache)await cache.put("app.enc",r2.clone());app=r2;ls("aver",String(ver.a));fresh=true}catch(e){if(!app)throw new Error("Could not download the app. Check your internet and try again.")}}}
 if(enc&&app)return{enc:await enc.arrayBuffer(),app:await app.arrayBuffer(),fresh:fresh};
 throw new Error("No data on this phone yet. Open the app once with internet.")}
async function decrypt(buf,pw,isText){var u=new Uint8Array(buf);if(u.length<45||String.fromCharCode(u[0],u[1],u[2],u[3])!=="IFC1")throw new Error("bad");
 var salt=u.slice(4,20),iv=u.slice(20,32),ct=u.slice(32),km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]),
 key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]),pt;
 try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct)}catch(e){var er=new Error("Wrong password");er.wrong=1;throw er}
 var s=new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip")),tx=await new Response(s).text();return isText?tx:JSON.parse(tx)}
function start(app,P){window.__ADMIN=P;app=app.replace(/<head[^>]*>/i,function(m){return m+'<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="IFFCO Visit">'});document.open();document.write(app);document.close()}
var files=null,busy=false;
if(typeof DecompressionStream==="undefined"||!window.crypto||!crypto.subtle){$("#sub").textContent="Phone not supported";$("#err").textContent="Please update your phone software and open the link again.";return}
async function attempt(pw,auto){if(busy)return;busy=true;$("#err").textContent="";$("#go").disabled=true;
 try{if(!files)files=await getFiles();$("#msg").textContent="Opening...";var P=await decrypt(files.enc,pw,false),app=await decrypt(files.app,pw,true);
  ls("pw",pw);start(app,P)}
 catch(e){busy=false;$("#go").disabled=false;$("#msg").textContent="";$("#sub").textContent="Enter the visit app password";$("#f").hidden=false;
  if(e.wrong){try{localStorage.removeItem(LS+"pw")}catch(x){}if(files&&!files.fresh){try{localStorage.removeItem(LS+"dver");localStorage.removeItem(LS+"aver")}catch(x){}files=null}$("#err").textContent=auto?"":"Wrong password. Try again."}
  else if(e.message==="bad")$("#err").textContent="The data file is not valid. Update again from Admin.";
  else $("#err").textContent=e.message||"Something went wrong";
  setTimeout(function(){var p=$("#pw");if(p&&!$("#f").hidden)p.focus()},50)}}
$("#f").addEventListener("submit",function(e){e.preventDefault();var v=$("#pw").value;if(v)attempt(v,false)});
var saved=lg("pw");
if(saved)attempt(saved,true);else{$("#sub").textContent="Enter the visit app password";$("#f").hidden=false;setTimeout(function(){$("#pw").focus()},50);getFiles().then(function(f){files=f;$("#msg").textContent=""}).catch(function(e){$("#err").textContent=e.message})}
})();
</script></body></html>
